<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05030c;--ink:#b9a8d9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
html{position:fixed;inset:0;width:100%}
body{position:fixed;inset:0;width:100%}
#inv,#pc .b,#phone .scr,#jrnl .jl,#board,#title{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
:root{--ch:190px;--ww:min(100%,calc((100vh - var(--ch)) * 16 / 9))}
@supports (height:100dvh){:root{--ww:min(100%,calc((100dvh - var(--ch)) * 16 / 9))}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 8px}
@supports (height:100dvh){body{height:100dvh}}
#rot{display:none;color:#ffd27a;font-size:12px}

T('Cercle Privé',{W:460,wall:'#2a1c14',floor:'#1a100a',acc:'#c9a45a',am:'rgb(78,64,52)',lc:[255,190,120],xs:[60,230,330],lb:['Lire les journaux',"S'asseoir dans un fauteuil",'Parler au barman'],props:[['books',30,100],['fire',150],['sofa',230,'#3a2a1a'],['bar',320,110],['chand',250,4]],npcs:[[360,134,'barman',-1,2,.4]],t:["Journaux financiers, cigares, whisky de quarante ans. Ici, on achète des gouvernements au dessert.","Tu t'enfonces dans un fauteuil de cuir. Le feu crépite. Personne ne te regarde, et c'est une insulte.","Le barman murmure : « Monsieur désire ? Ici, on ne demande jamais « pourquoi ». »"]});
T("Jardin d'hiver",{W:520,wall:'#14281e',floor:'#1a2a20',acc:'#a8ffd0',am:'rgb(90,110,100)',lc:[200,255,220],xs:[100,250,420],lb:['Respirer les fleurs',"S'asseoir près du bassin",'Parler au jardinier'],props:[['trees',20,480],['fount',230]],npcs:[[420,150,'stand',-1,1,.5]],t:["Orchidées, palmiers, fougères. Sous la verrière, la pluie tombe et personne ne la reçoit. Un luxe absolu.","Tu t'assois au bord du bassin. L'eau est parfaitement claire. Pour un instant, tu as oublié la ville.","Le jardinier taille une fleur : « Elles ne meurent jamais, ici. C'est leur seul défaut. »"]});
T('Musée du Futur',{W:520,wall:'#2a2a3a',floor:'#10101a',acc:'#ffffff',am:'rgb(76,80,96)',lc:[220,230,255],xs:[130,250,420],lb:['Admirer une œuvre',"S'asseoir sur le banc",'Parler au guide'],props:[['holo',130,'FUTUR'],['vitrine',230,60],['paint',320,60,34,'#4a7aa8'],['holo',420,'MONDE'],['pillar',480,'#4a4a5a']],t:["Des hologrammes tournent sous des vitrines : une Terre sans pluie, des villes sans ombres. Le futur, vu d'avant.","Tu t'assois face à une œuvre qui change quand tu clignes des yeux. Ça t'apaise et ça t'inquiète.","Le guide récite : « Ici, nous exposons ce que l'humanité a oublié. Et ce qu'elle a fabriqué pour s'en souvenir. »"]});
T('Galerie Verre',{W:440,wall:'#6a6a76',floor:'#2a2a30',acc:'#ffffff',am:'rgb(110,112,124)',lc:[255,255,255],li:.6,xs:[100,220,360],lb:['Contempler une toile',"S'asseoir sur le banc",'Parler à la galeriste'],props:[['paint',50,50,36,'#c0392b'],['paint',140,36,50,'#2a4a8a'],['paint',230,60,30,'#e8c82a'],['holo',340,'ART'],['vitrine',385,40]],t:["Des toiles blanches avec une tache rouge. Prix : le loyer d'un an. Tu cherches l'œuvre. Tu ne trouves que le prix.","Tu t'assois sur un banc plus cher que ton appartement. Le blanc te bouffe les yeux.","La galeriste sourit : « Cette toile exprime l'angoisse du siècle. Elle a été peinte par une IA. »"]});
T('Opéra de la Ville',{W:520,wall:'#2a0a14',floor:'#14040a',acc:'#ffd27a',am:'rgb(56,38,44)',lc:[255,200,150],xs:[90,300,440],lb:['Admirer la salle',"S'asseoir dans une loge","Parler à l'ouvreuse"],sp:'time',cost:0,adv:40,props:[['stage',30,240],['curtain',30,50,'#8a1030'],['curtain',220,50,'#8a1030'],['chand',160,8],['chand',380,8],['seats',290,200],['pillar',280,'#c9a45a'],['pillar',505,'#c9a45a']],npcs:[[440,150,'stand',-1,5,.3]],t:["Une scène immense, des rideaux pourpres, des loges dorées. Une répétition commence, quelque part dans l'ombre.","Tu t'assois dans une loge. Une soprano chante pour personne. Tes yeux piquent, un peu. Quarante minutes passent.","L'ouvreuse chuchote : « Silence, monsieur. Même les mensonges chantent mieux ici. »"]});
T('Cinéma Rex',{W:480,wall:'#1a0a24',floor:'#0a0410',acc:'#ffcf3a',am:'rgb(40,30,56)',lc:[255,120,150],xs:[70,250,390],lb:["Regarder l'affiche",'Voir un film',"Parler à l'ouvreur"],sp:'time',cost:6,adv:120,props:[['screenf',150,180],['seats',130,220],['neon',60,'CINEMA','#ff2a8a'],['counter',350,100,'#5a1020'],['neon',400,'POPCORN','#ffcf3a']],t:["L'affiche : un détective sous la pluie, une femme de dos, un titre qui ressemble à ta vie. Les séances se suivent.","Un vieux film noir, grain d'époque. La pluie à l'écran se mêle à celle du dehors. Deux heures s'évaporent.","L'ouvreur grommelle : « Pas de cigarette, pas de téléphone. Et ne parlez pas pendant les morts. »"]});
T('Casino Ivoire',{W:560,wall:'#2a0a24',floor:'#14040e',acc:'#ffd27a',am:'rgb(56,34,50)',lc:[255,180,200],xs:[120,260,470],cost:10,lb:['Regarder les croupiers','Jouer à la roulette','Parler au croupier'],props:[['slots',50,4],['rug',40,500,'#8a1030'],['roul',230],['cardt',330],['roul',420],['chand',150,6],['chand',330,6]],npcs:[[262,132,'stand',-1,2,.4],[460,150,'stand',1,3,.9],[110,150,'stand',1,1,.2]]});
T('Arcade Pixel',{W:420,wall:'#1a1030',floor:'#0a0618',acc:'#ff2a8a',am:'rgb(46,36,66)',lc:[255,120,200],xs:[110,215,330],props:[['arcade',50,6],['neon',200,'ARCADE','#25f4ff'],['jukebox',380]]});
T('Club Velours',{W:520,wall:'#1a102a',floor:'#0a0614',acc:'#b66bff',am:'rgb(34,28,50)',lc:[180,100,255],xs:[120,220,440],lb:['Regarder la piste','Danser','Parler au barman'],sp:'time',cost:8,adv:45,props:[['floorf',110,200],['disco',210],['bar',330,160],['neon',70,'CLUB','#b66bff']],npcs:[[440,134,'barman',-1,3,.1],[160,150,'stand',1,1,.2],[260,150,'stand',-1,5,.6]],t:["Basses profondes, lasers, corps en sueur. Personne ici ne pense à demain.","Tu te laisses porter par la musique. Les lumières t'avalent. Quarante-cinq minutes plus tard, tu respires encore.","Le barman crie par-dessus la musique : « Un verre ? Tout est gratuit si tu pars avant l'aube ! »"]});
T('Karaoké Mei',{W:420,wall:'#2a1030',floor:'#14081c',acc:'#ff2a8a',am:'rgb(52,36,66)',lc:[255,120,200],xs:[100,200,330],lb:["Regarder l'écran",'Chanter','Parler à l\'hôtesse'],sp:'time',cost:10,adv:40,props:[['screen2',150,100],['sofa',60,'#8a1a5a'],['sofa',270,'#8a1a5a'],['disco',230]],npcs:[[340,150,'stand',-1,4,.4]],t:["Un écran de paroles défile, des voix fausses, des rires, un tambourin. Un salon de bonheur à louer.","Tu chantes un vieux standard. Faux, mais personne ne juge. Quarante minutes plus tard, ta gorge brûle.","L'hôtesse sourit : « Chacun sa chanson, chéri. La tienne a l'air triste. »"]});
T('Salon de mahjong',{W:420,wall:'#3a1a10',floor:'#1a0c08',acc:'#ffcf3a',am:'rgb(80,56,44)',lc:[255,200,120],xs:[80,200,330],cost:5,lb:['Regarder la partie','Jouer une partie','Parler au patron'],props:[['lan',30,380],['mj',70],['mj',170],['mj',270],['neon',380,'MAHJONG','#ffcf3a']],npcs:[[330,150,'stand',-1,2,.4]],t:["Le cliquetis des tuiles, la fumée de thé, quatre visages fermés. Personne ne parle. Tout se dit dans les mains.","Tu poses ta mise. La tuile tombe : tu perds, ou tu crois perdre. Les vieux te regardent comme un gamin.","Le patron murmure : « Au mahjong, on ne triche pas. On observe les autres tricher. »"]});
T('Dojo du Tigre',{W:420,wall:'#2a2a2a',floor:'#3a2a1a',acc:'#e8e8f0',am:'rgb(88,84,80)',lc:[255,240,210],xs:[90,200,330],lb:['Observer les élèves',"S'entraîner",'Parler au sensei'],sp:'time',cost:0,adv:60,props:[['tatami',40,300],['wrack',330],['bag',390]],npcs:[[150,150,'stand',1,1,.2],[230,150,'stand',-1,5,.8],[360,150,'stand',-1,4,.5]],t:["Des élèves s'affrontent en silence. Le bois du sol est usé par des décennies de pieds nus.","Une heure de kata, de souffle et de sueur. Ton corps te hait, ton esprit dort enfin.","Le sensei dit sans te regarder : « Un coup donné sans colère est un coup juste. Rare, détective. »"]});
T('Temple du Dragon',{W:460,wall:'#3a1010',floor:'#1a0808',acc:'#ffcf3a',am:'rgb(76,48,40)',lc:[255,180,100],xs:[100,190,370],lb:["Observer l'autel","Allumer de l'encens",'Parler au moine'],sp:'time',cost:1,adv:20,props:[['lan',30,420],['altar',160],['pillar',120,'#8a1a1a'],['pillar',240,'#8a1a1a'],['cush',290,3]],npcs:[[370,150,'stand',-1,5,.3]],t:["Un dragon doré veille sur l'autel. Des ex-voto, des bougies, des centaines de prières qui sentent la cire.","Tu allumes un bâton d'encens et formules un vœu. La fumée monte tout droit. Bon signe, dit-on.","Le moine sourit : « Chaque vœu a un prix, détective. Parfois, le prix est de le formuler. »"]});
T('Noodle Express',{W:380,wall:'#3a1a10',floor:'#1a0e08',acc:'#ff7a2a',am:'rgb(70,50,44)',lc:[255,170,100],xs:[100,230,310],adv:20,cost:4,props:[['neon',90,'NOODLE','#ff7a2a'],['kitchen',200,150],['counter',210,150,'#4a2a14'],['stools',220,5]],npcs:[[270,132,'barman',-1,2,.5]],t:["Un menu gras punaisé au mur : trois plats, tous des nouilles. Le comptoir est collant, la vapeur monte du wok.","Un bol brûlant de nouilles au gingembre. Tu manges debout, au coude à coude avec des inconnus.","Le cuistot ne sourit pas : « Mange ou paie. Mais ne regarde pas dans la marmite. »"]});
T('Café du Coin',{W:380,wall:'#4a3a2a',floor:'#2a1c10',acc:'#ffcf3a',am:'rgb(90,76,64)',lc:[255,210,150],xs:[100,200,300],adv:15,cost:3,props:[['win',40,'#ffcf3a',60],['table',130],['table',200],['menu',250,'CAFE'],['counter',290,90,'#3a2414'],['plant',350]],npcs:[[330,134,'barman',-1,1,.5]],t:["Une machine à espresso fume derrière le comptoir. Un tableau noir liste cinq cafés, tous à moitié effacés.","Un espresso serré, une viennoiserie rassise. Le café le plus honnête de tout le quartier.","Le patron essuie un verre : « Les gens ici ne prennent que du noir. Comme la vie. »"]});
T('Diner 66',{W:400,wall:'#3a4a5a',floor:'#2a2a30',fl:'check',acc:'#ff2a8a',am:'rgb(84,86,100)',lc:[255,150,200],xs:[110,200,330],adv:25,cost:6,props:[['jukebox',56],['booth',110],['bar',230,150],['stools',240,5],['neon',200,'DINER','#ff2a8a']],npcs:[[320,134,'barman',-1,3,.2]],t:["Banquettes en vinyle rouge, damier noir et blanc, jukebox qui crachote un vieux tube. Un diner à l'américaine d'un autre siècle.","Un hamburger et un milkshake fluo. Le gras t'apaise : ce n'est pas du vrai bœuf, mais c'est de la vraie nostalgie.","La serveuse claque son chewing-gum : « Un café, chéri ? Ici, on remplit les tasses et jamais les questions. »"]});
T('Ramen Zhao',{W:420,wall:'#4a1010',floor:'#1a0808',acc:'#ff3a2a',am:'rgb(80,48,44)',lc:[255,130,90],xs:[100,240,330],adv:20,cost:5,props:[['lan',20,380],['kitchen',230,170],['counter',250,150,'#3a2414'],['stools',260,5],['menu',100,'RAMEN'],['table',160]],npcs:[[300,132,'barman',-1,2,.5]],t:["Une carte écrite à la main, des lanternes rouges, une grande marmite qui bouillonne depuis vingt ans.","Un ramen fumant, le bouillon trouble de porc et de gingembre. Tu fermes les yeux. C'est presque de l'amour.","Zhao hoche la tête : « Le secret du bouillon, détective ? Du temps. Et du silence. »"]});
T('Maison de thé',{W:420,wall:'#2a3a1a',floor:'#3a2a1a',acc:'#8aa83a',am:'rgb(84,90,64)',lc:[240,230,170],xs:[80,200,330],lb:['Regarder la carte','Commander un thé','Parler à la maîtresse de thé'],adv:30,cost:5,props:[['lan',30,360],['tatami',50,240],['cush',60,3],['cush',190,3],['jars',330,70],['plant',290],['steam',330,70]],npcs:[[360,150,'stand',-1,4,.2]],t:["Des paravents en papier, des tasses sans anse, une odeur de jasmin et de feuilles brûlées.","Un thé vert, amer puis doux. Tu retrouves ton souffle. Le temps ici ne compte pas pareil.","La maîtresse de thé verse sans un mot, puis dit : « Le thé ne répond à aucune question. Il rend simplement possibles les réponses. »"]});
T('Dim Sum Express',{W:420,wall:'#5a2a10',floor:'#2a1408',acc:'#ffcf3a',am:'rgb(90,60,44)',lc:[255,200,130],xs:[100,200,330],adv:20,cost:5,props:[['lan',20,380],['table',100],['table',190],['kitchen',260,140],['steam',260,140],['menu',140,'DIMSUM']],npcs:[[320,132,'barman',-1,2,.3]],t:["Des paniers de bambou empilés, de la vapeur partout, des chariots qui tintent. Tout le monde parle en même temps.","Des raviolis brûlants, farcis au porc et à la ciboulette. Tu te brûles la langue, tu souris quand même.","La serveuse crie en poussant son chariot : « Crevettes ! Porc ! Poulet ! Choisis vite, il y a la queue ! »"]});
T('Le Ciel',{W:480,wall:'#14141b',floor:'#0a0a10',acc:'#ffd27a',am:'rgb(60,52,62)',lc:[255,215,150],xs:[90,180,350],cost:25,adv:50,props:[['win',40,'#ffd27a',140],['table',90],['table',180],['piano',260],['chand',140,5],['counter',350,100,'#14141b'],['plant',460]],npcs:[[390,134,'stand',-1,0,.3]],t:["Nappes blanches, bougies, une baie vitrée sur la ville illuminée. Même la pluie, ici, a l'air de bien se tenir.","Un menu dégustation de sept services. Chaque assiette est une œuvre, chaque bouchée un reproche pour ta vie.","Le maître d'hôtel s'incline : « Monsieur est attendu ? Non ? Alors une table près de la cuisine. »"]});
T('Cantine Corpo',{W:440,wall:'#22303a',floor:'#1a222a',acc:'#bfe0ff',am:'rgb(100,110,124)',lc:[210,235,255],xs:[100,200,330],cost:4,adv:15,props:[['tv',60,50],['table',120],['table',190],['counter',280,120,'#1a2a3a'],['vend',400,'#25f4ff']],npcs:[[330,134,'stand',-1,0,.3]],t:["Des plateaux gris, des visages gris, un écran qui diffuse le logo de l'entreprise en boucle.","Un plat unique, équilibré, sans saveur. Tu manges pour tenir, comme tout le monde ici.","La cantinière marmonne : « Plateau, badge, sortie. Pas de pause. Les logos n'attendent pas. »"]});
T("Hall de l'immeuble",{W:440,wall:'#2a1e1a',floor:'#1a120e',acc:'#ffb04a',am:'rgb(74,58,50)',lc:[255,200,130],li:.7,xs:[90,244,312],cost:0,props:[['rug',30,330,'#4a1a1a'],['mbox',58],['plant',134],['paint',156,34,24,'#6a4a2a'],['counter',206,128,'#2a180c'],['lobbyx',210],['fan',250],['neon',372,'MAISON','#ff2a8a'],['oldelev',390]],npcs:[[282,134,'stand',-1,0,.5,{c:{jk:'#4a5a3a',sl:'#5a6a4a',pt:'#2a2a33',h:'#d8d8d8'},big:1}]]});
T('Prêteur sur gages',{W:400,wall:'#2a2a1a',floor:'#1a1a10',acc:'#ffcf3a',am:'rgb(66,62,48)',lc:[255,220,130],xs:[100,200,320],cost:8,props:[['pawn',40,230],['fan',200],['counter',270,110,'#1a1a22'],['neon',340,'GAGES','#ffcf3a']],npcs:[[330,134,'stand',-1,2,.4]]});
T('Laverie 24h',{W:420,wall:'#2a3a4a',floor:'#222a30',acc:'#4aa8ff',am:'rgb(110,120,130)',lc:[220,240,255],li:.6,xs:[100,200,320],cost:3,lb:['Regarder le linge','Acheter de la lessive (souvenir)','Parler au client'],props:[['wash',50,6],['neon',330,'24H','#4aa8ff'],['sofa',320,'#3a3a46']],npcs:[[340,150,'stand',-1,1,.2]],t:["Des machines qui tournent, un client endormi sur un banc, le bruit du linge qui roule. Un monde simple et chaud.","Un petit paquet de lessive oublié, parfum « Fraîcheur d'un autre monde ». Tu le gardes.","Le client marmonne sans ouvrir les yeux : « Ça tourne depuis trois jours. Elle ne revient pas. »"]});
T('Supermarché de nuit',{W:480,wall:'#2a4a3a',floor:'#1a2a22',acc:'#55ff9a',am:'rgb(104,120,112)',lc:[220,255,230],li:.6,xs:[100,200,380],cost:5,props:[['aisle',50,100],['aisle',170,100],['cash',340],['neon',430,'MARKET','#55ff9a']],npcs:[[380,134,'stand',-1,1,.5]],t:["Des rayons de conserves, de nouilles, de boissons fluo. Une lumière blanche qui n'éteint jamais la fatigue.","Tu glisses un petit objet dans ton sac : une conserve de pêches du vieux monde. Elle vaut dix fois son prix.","La caissière scanne sans te regarder : « Sac ? Ticket ? Rien ? Comme tout le monde, à cette heure. »"]});
T('Herboristerie',{W:380,wall:'#1a3a2a',floor:'#10200f',acc:'#55ff9a',am:'rgb(72,84,70)',lc:[200,255,200],xs:[90,200,290],cost:6,props:[['jars',40,170],['lan',20,200],['counter',250,110,'#2a180c'],['steam',250,110]],npcs:[[290,134,'stand',-1,5,.3]],t:["Des centaines de tiroirs étiquetés, des herbes séchées, des racines tordues. Ça sent le camphre et la terre mouillée.","Un sachet d'herbes pour le sommeil. L'herboriste jure : « Dormir, rêver ou oublier. À toi de choisir. »","L'herboriste mâche une racine : « Pour la fatigue, tout est ici. Pour la culpabilité, il faudra chercher ailleurs. »"]});
T('Bazar de nuit',{W:480,wall:'#3a1a10',floor:'#1a0c06',acc:'#ff7a2a',am:'rgb(84,56,44)',lc:[255,190,120],xs:[100,230,380],cost:7,props:[['lan',20,440],['rug',60,380,'#8a2a2a'],['rack',40,100],['jars',160,80],['vitrine',270,70],['crate',360,3]],npcs:[[400,134,'stand',-1,2,.3]],t:["Un fouillis de lanternes, de tapis, de jouets cassés et de montres sans aiguilles. Le bazar du monde d'avant.","Tu marchandes un petit porte-bonheur en jade. Le vendeur gémit, tu paies, tout le monde est content.","Le vendeur te tire par la manche : « Pour toi, ami, prix de nuit. Demain, c'est le double. »"]});
T('Encens & Talismans',{W:380,wall:'#4a2a1a',floor:'#2a1608',acc:'#ffb04a',am:'rgb(84,60,46)',lc:[255,190,110],xs:[90,190,300],cost:6,props:[['altar',40],['lan',20,340],['jars',200,70],['counter',280,90,'#2a180c'],['steam',200,70]],npcs:[[330,134,'stand',-1,5,.3]],t:["Des centaines de bâtons d'encens, de talismans jaunis, de statuettes. La fumée te pique les yeux.","Tu repars avec un talisman en papier jaune. Il paraît qu'il éloigne les mauvais esprits. Ou les huissiers.","La vieille marchande chuchote : « Ne le montre à personne. Ni à un humain, ni à autre chose. »"]});
T('Boutique Aurélie',{W:420,wall:'#2a2a3a',floor:'#14141e',acc:'#ffd27a',am:'rgb(104,100,116)',lc:[255,235,200],li:.6,xs:[100,220,320],cost:12,props:[['rug',40,260,'#8a2a4a'],['rack',40,110],['rack',170,100],['mirror',300,26],['counter',340,70,'#14141b']],npcs:[[370,134,'stand',-1,4,.3]],t:["Des robes, des manteaux, des étoffes qui coûtent le prix d'un mois de loyer. Des miroirs partout, pour qu'on ne s'oublie pas.","Tu essaies une écharpe de soie. Dans le miroir, tu as presque l'air d'un homme heureux.","La vendeuse te scrute : « Monsieur cherche quelque chose en particulier... ou quelqu'un à impressionner ? »"]});
T('Maison Vauclair',{W:400,wall:'#1a1a22',floor:'#0a0a10',acc:'#ffd27a',am:'rgb(70,66,80)',lc:[255,225,170],xs:[100,200,300],cost:30,props:[['vitrine',40,100],['vitrine',160,100],['chand',200,5],['counter',300,90,'#14141b']],npcs:[[340,134,'stand',-1,0,.3]],t:["Des vitrines de diamants, de rubis, de perles. Chaque pierre est braquée par un projecteur, comme sur une scène.","Tu achètes une minuscule breloque d'argent. Elle coûte trois mois de ta vie. Elle brille quand même.","Le bijoutier sourit : « Un diamant est éternel, monsieur. Contrairement aux promesses qui l'accompagnent. »"]});
T('Salon Auto Prestige',{W:520,wall:'#1a1a22',floor:'#101018',acc:'#e8e8f0',am:'rgb(104,108,124)',lc:[240,245,255],li:.6,xs:[100,260,420],cost:35,props:[['car',60,'#c0c0d8'],['car',230,'#8a2a4a'],['counter',400,100,'#14141b'],['neon',440,'AUTO','#e8e8f0']],npcs:[[430,134,'stand',-1,0,.3]],t:["Deux bolides sous des projecteurs, des jantes brillantes, un prix à six chiffres. Tu n'oses pas toucher.","Tu repars avec une petite maquette de voiture. Le seul véhicule que tu pourras te payer ici.","Le vendeur te toise : « Un essai ? Non ? Comme tout le monde. Mais vous avez un beau regard pour un homme à pied. »"]});
T('Banque Centrale',{W:480,wall:'#3a3a44',floor:'#1a1a22',acc:'#e8e8f8',am:'rgb(94,98,108)',lc:[235,240,255],xs:[100,160,330],props:[['pillar',60,'#8a8a96'],['pillar',200,'#8a8a96'],['rug',40,150,'#2a3a5a'],['chand',120,5],['counter',230,150,'#2a2a35'],['vault',390],['neon',340,'BANK','#e8e8f8']],npcs:[[330,134,'stand',-1,0,.3]]});
T('Bibliothèque municipale',{W:460,wall:'#3a2a1a',floor:'#1a1208',acc:'#ffe9b0',am:'rgb(88,76,60)',lc:[255,225,170],xs:[90,200,360],lb:['Parcourir les rayons',"S'asseoir pour lire",'Parler à la bibliothécaire'],sp:'time',cost:0,adv:60,props:[['books',30,110],['books',260,110],['reading',150,1],['reading',380,1]],npcs:[[360,150,'stand',-1,4,.3]],t:["Des milliers de livres, tous de papier : un luxe fossile. L'odeur de poussière est la plus honnête de la ville.","Tu t'assois et lis un vieux polar. Une heure passe. Le héros, lui aussi, ne dormait pas.","La bibliothécaire chuchote : « Chut. Les livres dorment. Et ceux qui les lisent aussi, parfois. »"]});

T('Spa Nuage',{W:440,wall:'#1a3a3a',floor:'#10282a',acc:'#7aeaff',am:'rgb(80,110,116)',lc:[190,245,255],xs:[100,200,370],lb:['Respirer la vapeur',"S'allonger dans le bain",'Parler à la masseuse'],sp:'time',cost:20,adv:60,props:[['bath',60,160],['steam',60,160],['plant',250],['sofa',290,'#2a4a5a']],npcs:[[390,150,'stand',-1,4,.3]],t:["De la vapeur chaude, des galets lisses, une lumière turquoise. Pour un instant, la ville n'existe plus.","Tu glisses dans l'eau. Soixante minutes de silence parfait. Tes muscles pleurent de soulagement.","La masseuse murmure : « Tout le monde a un nœud quelque part, monsieur. Le vôtre est dans la nuque... et dans le passé. »"]});
T('Finance Horizon',{W:480,wall:'#182838',floor:'#0e1620',acc:'#7ac8ff',am:'rgb(86,96,110)',lc:[210,235,255],xs:[100,220,400],props:[['ticker',30,200],['tv',60,50],['tv',130,50],['desk',200,4,'#25f4ff']],npcs:[[100,150,'stand',1,0,.2],[330,150,'stand',-1,4,.7]],t:["Des écrans, des chiffres qui défilent, des hommes en costume qui hurlent des codes. La seule religion qui reste.","Tu t'assois un instant dans un fauteuil de verre. Un trader te lance : « Un tuyau ? Achète du Tyrell. Ou ne fais rien. »","Le trader sans te regarder : « Ici, les sentiments sont un risque systémique. »"]});

T('Laboratoire Génétique',{W:480,wall:'#1a2a38',floor:'#0e161e',acc:'#55ff9a',am:'rgb(84,104,110)',lc:[200,255,230],xs:[100,380,230],props:[['tubes',40,160],['vat',240,3],['desk',360,1,'#55ff9a'],['srv',420,2]],npcs:[[330,150,'stand',-1,4,.3]],t:["Des éprouvettes de liquide vert, des cuves où flottent des formes indistinctes. Tout est propre, trop propre.","Le terminal affiche une séquence génétique tronquée. À la fin : « N6 — STATUT : EN FUITE ».","Le technicien chuchote : « Ils sont conçus pour quatre ans. Après, ils s'éteignent. Ou ils se réveillent. »"]});
T('Dépôt Logistique',{W:520,wall:'#2a2e36',floor:'#1a1c22',acc:'#ff7a2a',am:'rgb(76,80,92)',lc:[255,190,130],xs:[100,260,420],props:[['crate',40,5],['crate',200,4],['conv',330,170]],npcs:[[330,150,'stand',-1,0,.3]],t:["Des palettes empilées jusqu'au plafond, des étiquettes de pays disparus, des chariots à l'arrêt. Le dépôt dort.","Le terminal du chef d'équipe affiche des numéros de lot, tous barrés de rouge. « RETOURS : 0 ».","Le manutentionnaire grogne : « Si c'est pas sur la liste, c'est pas dans l'entrepôt. Et si c'est dedans, t'as rien vu. »"]});
function themeOf(b){return TH[b.nm]}
const POLF=['Rez-de-chaussée','Étage 1 — Inspecteurs','Étage 2 — Archives & labo','Sous-sol — Cellules','Étage 3 — Direction','Ton bureau','Sous-sol 2 — Armurerie','Sous-sol 2 — Stand de tir','Étage 2 bis — Salle de contrôle','Salle d\'audience',"Salle d\'interrogatoire"];
const POLW=[620,560,580,580,520,420,540,600,560,560,380];
function polLine(k,arr){S.pl=S.pl||{};S.pl[k]=((S.pl[k]||0)+1);return arr[(S.pl[k]-1)%arr.length]}
function makePol(f,b){
  const c={b,a:'pol',f,nm:'Commissariat · '+POLF[f],W:POLW[f],am:'rgb(38,46,62)',draw:polDraw,lights:polLights,occ:occTh,npcs:[],acts:[],g:['#c0392b','#4a7aa8','#e8c82a','#2a8a6a','#8a4a8a','#e8e8f0'],acc:'#7ab8ff',th:{}};
  const mkn=(x,y,k,d,pi,ph,ex)=>mk(x,y,k,d,pi,ph,ex);
  const elev=x=>({x,l:"Prendre l'ascenseur",f(){polMenu()}});
  const A=(x,l,f)=>c.acts.push({x,l,f});
  if(f===0){
    A(20,'Sortir',()=>{scene=0;px=b.x;vx=0;fade=1;audioLow(0);sfx('door')});
    A(190,'Lire les avis de recherche',()=>U("Quatre visages sur l'avis de recherche : Nexus-6, évadés des colonies off-world. Un des portraits est barré de rouge. « RETIRÉ ». Pourquoi ?"));
    A(360,'Parler au sergent',()=>U(polLine('sg',["Le sergent tape sans lever la tête : « Inspecteur. Le capitaine vous attend à l'étage. Il n'a pas l'air de bonne humeur. »","« Les unités Nexus-6 ? Pas de nouvelles. Mais trois morgues ont signalé des corps aux yeux... bizarres. »","« La pluie rend les gens nerveux. Hier, dix-sept appels pour des gens qui voyaient des licornes. »"])));
    A(560,"Prendre l'ascenseur",()=>polMenu());
    c.npcs=[mkn(390,126,'stand',-1,4,.2,{big:1,c:COPC,cop:1}),mkn(100,150,'stand',1,5,.7,{c:COPC,cop:1}),mkn(160,150,'stand',1,2,1.3),mkn(470,150,'stand',-1,0,.4,{c:COPC,cop:1})];
  }else if(f===1){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(130,'Machine à café',()=>{S.boostT=Math.max(S.boostT,30);U("Un café de distributeur, noir, brûlant, infâme. Il tient debout tout seul. Ça te réveille.")});
    A(215,'Parler à un collègue',()=>U(polLine('co',["Ton collègue grommelle : « Bryant te cherche. Il dit que ton dernier rapport sentait le whisky. Il est à l'étage de la direction. »","« Secteur 9 ? Personne n'y va. Ceux qui y vont ne reviennent pas, ou reviennent changés. »","« Tu as vu les nouveaux ? Ils sont plus jeunes que nous, et ils ne dorment jamais. »"])));
    A(350,'Regarder la carte du secteur',()=>U("Une carte holographique de la ville. Des zones rouges clignotent dans les bas-fonds. Le secteur 9 est cerclé trois fois. Quelqu'un a griffonné dessus : « personne ne revient ». "));
    A(465,'Entrer dans ton bureau',()=>{goPol(5,40)});
    c.npcs=[mkn(215,150,'stand',-1,1,.9)];
    c.crowd=[mp('type',70,150,1,2,.3),mp('type',132,150,1,4,.9),mp('type',194,150,1,5,1.6),mp('phone',270,150,-1,3,.4),mp('walk',300,150,1,0,.7,{x0:150,x1:420,v:16})];
  }else if(f===2){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(95,"Tableau des analyses (mode d'emploi)",()=>labBoard());
    A(150,'Table à empreintes',()=>labStation('fp'));
    A(215,'Séquenceur ADN',()=>labStation('dna'));
    A(280,'Banc de balistique',()=>labStation('ball'));
    A(342,'Parler au technicien',()=>U(polLine('tc',["Le technicien : « Règle simple, inspecteur. Les traces de doigts vont sur la table à gauche, les mégots et les cheveux dans le séquenceur au milieu, les douilles sur le banc à droite. Après, vous partez : je vous fais biper. »","« Pas besoin de rester planté là. Le résultat arrive sur votre pager, déjà classé dans votre dossier. »","« Aucun ADN humain sur ce corps de la morgue. Quelque chose d'autre. Quelque chose de... fabriqué. Mais ça, c'est une autre histoire. »"])));
    A(470,'Examiner le corps',()=>U("Tu soulèves le drap : un homme, la trentaine, les yeux ouverts. Une cicatrice nette à la nuque. Numéro gravé : N6MAA10816."));
    A(540,'Fouiller les archives',()=>U("Rangées de dossiers sur des étagères métalliques. Tu tombes sur un nom barré : « NEXUS-6 / N6FAA1701 ». Le dossier est vide."));
    c.npcs=[mkn(215,150,'stand',1,5,.3),mkn(330,132,'stand',-1,4,.6)];
  }else if(f===3){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(110,'Parler au détenu',()=>U(polLine('dt',["Le détenu rit derrière les barreaux : « Tu sais ce que ça fait, détective, de ne pas savoir ce que tu es ? »","« Ils m'ont arrêté pour avoir pleuré dans la rue. C'est un crime, maintenant, de ressentir ? »"])));
    A(340,"Entrer dans la salle d'interrogatoire",()=>{if(!S.coat||S.pj){U("Une porte blindée, un digicode : tu n'as pas ton badge sur toi. Enfile l'imperméable.");return}goPol(10,40);setTimeout(()=>say("Un sas, un bip, la porte blindée s'ouvre. La salle d'interrogatoire : béton nu, mousse acoustique, une table vissée au sol, une lampe nue qui se balance. Derrière la glace sans tain, quelqu'un respire."),150)});
    A(500,'Examiner le Voight-Kampff',()=>U("La machine Voight-Kampff : une caméra pour l'œil, un soufflet pour le souffle. Elle mesure l'empathie en fractions de seconde. Tu hésites à t'asseoir devant."));
    c.npcs=[mkn(100,150,'stand',1,2,.4),mkn(380,150,'stand',-1,0,.2,{c:COPC,cop:1})];c.crowd=[mp('walk',200,150,1,5,.5,{x0:150,x1:300,v:14})];
  }else if(f===4){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(150,'Regarder la ville',()=>lookOut(2));
    A(205,'Consulter le tableau des affaires',()=>centralPanel());
  A(262,'Examiner le bureau du chef',()=>U("Le bureau du capitaine : un cendrier débordant de mégots de cigare, une carafe de bourbon, une pile de dossiers marquée « NEXUS — CONFIDENTIEL ». Sous le buvard, un petit mot : « Ne pas laisser l'inspecteur dormir. »"));
    A(345,'Parler au capitaine',()=>U(polLine('cp',["Le capitaine souffle sa fumée : « Quatre répliquants. Tu les trouves, tu les retires. Sans bruit. Sans histoires. »","« T'as une tête de déterré. Va dormir. Ou va boire. Mais retrouve-les avant la fin de la semaine. »","« Chez Lucky, dans le secteur 9. C'est là que tout se passe. Et là que tout se tait. »","« Tu sais ce qu'on dit : la nuit, la pluie lave tout. Sauf nous. »"])));
    A(455,'Se servir un verre',()=>{S.drunk=Math.min(1,S.drunk+.08);sfx('gulp');U("La carafe est lourde, le verre épais. Tu t'en sers deux doigts, sans demander. Le capitaine fait semblant de ne rien voir.")});
    A(500,'Examiner le coffre-fort',()=>U("Un coffre-fort encastré dans le mur, cadran de laiton. Une étiquette jaunie : « Pièces à conviction — Niveau 3 ». Tu n'as pas la combinaison. Pas encore."));
    c.npcs=[mkn(348,132,'stand',-1,3,.5,{big:1})];c.sOcc=[[270,110,420,132],[430,112,492,132]];
  }else if(f===6){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(112,()=>S.gun?'Rendre ton arme de service':'Retirer ton arme de service',()=>{S.gun^=1;sfx(S.gun?'reload':'cloth');U(S.gun?"Tu glisses ta carte dans le lecteur. Le tiroir blindé s'ouvre : ton blaster de service, noir mat, une ligne cyan le long du canon. Il pèse plus que prévu. Signature numérique, empreinte, et le voilà dans le holster de ton imperméable : il ne te quitte plus tant que tu portes le manteau.":"Tu poses ton arme dans le tiroir. L'armurier la scanne, hoche la tête, la range. « Bonne nuit, inspecteur. Essayez de ne pas en avoir besoin. »")});
    A(160,"Parler à l'armurier",()=>U(polLine('ar',["L'armurier ne lève pas les yeux de la culasse qu'il nettoie : « Un blaster, ça ne pardonne rien. Ni à celui qui tire, ni à celui qui a oublié de le vérifier. »","« Les unités Nexus ? Elles encaissent trois balles sans broncher. Il paraît qu'on ne vise jamais assez bas. »","« Chaque tir est enregistré, inspecteur. Chaque balle a un numéro, chaque numéro a un nom. Le vôtre est dans le système. »","« Le stand est au fond du couloir, derrière l'ascenseur. Allez-y. Le tir, ça évite de penser. »"])));
    A(235,'Prendre des munitions',()=>{if(!S.gun){U("L'armurier secoue la tête : « Pas d'arme signée, pas de munitions. Le règlement. »");return}if(S.ammo>=48){U("Tu as déjà tout ce qu'il te faut : quarante-huit coups, c'est la limite.");return}S.ammo=Math.min(48,S.ammo+12);sfx('reload');U("Une boîte de douze charges, sceau de cire sur le couvercle. Tu les rentres dans ta poche : "+S.ammo+" au total.")});
    A(290,'Examiner les armes',()=>U("Au mur, rangée de fusils à impulsion, de carabines tactiques, de lance-filets. Des diodes cyan courent le long des canons. Chaque arme a une étiquette : un numéro de série et un nom de policier. Certains noms sont barrés."));
    A(345,()=>S.gun?'Nettoyer ton arme':'Regarder l\'établi',()=>U(S.gun?"Tu démontes ton blaster sur l'établi : cellule, culasse, lentille. L'huile sent le métal chaud. Un geste de routine, presque un rituel.":"Sur l'établi : pièces détachées, chiffons gras, une lampe articulée. Un blaster entièrement démonté attend son propriétaire."));
    A(440,'Admirer les pistolets',()=>U("Un mur de pistolets, tous alignés, tous identiques sauf un : un vieux revolver à crosse de bois, derrière une vitre. Étiquette : « Pièce à conviction — affaire non résolue. »"));
    A(505,'Ouvrir ton casier',()=>U(polLine('cs',["Ton casier : un gilet pare-balles, une paire de menottes, une photo d'un type en uniforme. Ce n'est pas toi. Ça aurait pu l'être.","Au fond du casier, une cartouche isolée avec ton nom gravé. Tu ne te souviens pas de l'avoir mise là."])));
    c.npcs=[mkn(150,132,'stand',-1,2,.2,{c:COPC,cop:1,big:1}),mkn(330,150,'stand',1,5,.7,{c:COPC,cop:1})];c.sOcc=[[90,108,205,132],[210,100,285,132],[300,110,362,132],[478,40,534,132]];
  }else if(f===7){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(120,()=>S.ammo>0?'Dégainer et viser (munitions : '+S.ammo+')':'Tirer (plus de munitions)',()=>startAim('range'));
    A(190,'Changer de cible',()=>{S.rng={holes:[],score:0,shots:0,mov:S.rng?S.rng.mov:0,t:0,best:S.rng?S.rng.best:0};sfx('cloth');U("Tu appuies sur le bouton : le rail ramène la cible, une feuille neuve glisse dans le cadre. Silhouette blanche, cercles noirs, un petit « 7 » dans un coin.")});
    A(255,()=>S.rng&&S.rng.mov?'Arrêter la cible mobile':'Activer la cible mobile',()=>{if(!S.rng)S.rng={holes:[],score:0,shots:0,mov:0,t:0,best:0};S.rng.mov^=1;sfx('lock');U(S.rng.mov?"Le rail se met à ronronner : la cible glisse de gauche à droite, assez vite pour t'énerver.":"Le rail s'arrête. La cible reprend son immobilité de papier.")});
    A(325,'Parler au moniteur',()=>U(polLine('mo',["Le moniteur te tend des protections auditives : « Règle numéro un : on ne se retourne jamais avec l'arme en main. Règle numéro deux : voir règle numéro un. »","« Vous tirez comme quelqu'un qui n'a pas dormi, inspecteur. Respirez, c'est tout le secret. »","« Le record du stand ? Un type du service des mœurs. Je ne l'ai jamais compris. Il tremblait en dehors du stand. »"])));
    A(385,'Lire le tableau des scores',()=>{const b=S.rng?S.rng.best:0;U("Tableau des scores du service : 1. B. KALE — 58. 2. M. VOSS — 54. 3. TOI — "+(b||'--')+". 4. Un nom effacé. Quelqu'un a griffonné : « on ne vise pas les ombres ».")});
    c.npcs=[mkn(335,150,'stand',-1,0,.3,{c:COPC,cop:1})];c.crowd=[mp('game',480,150,-1,3,.4)];c.sOcc=[[100,108,160,132]];c.post=rangePost;
    if(!S.rng)S.rng={holes:[],score:0,shots:0,mov:0,t:0,best:0};
  }else if(f===8){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(200,'Observer les écrans',()=>U("Un mur d'écrans : carrefours, ruelles, halls d'immeubles. La ville vue d'en haut, en noir et blanc, sans son. Chaque silhouette est un point qui bouge, et personne ne sait qu'on le regarde."));
    A(270,'Consulter les enregistrements',()=>camPanel());
    A(350,"Parler à l'opérateur",()=>U(polLine('op',["L'opérateur ne quitte pas ses écrans : « Quarante caméras, huit tombent en panne par nuit. Les gens croient qu'on voit tout. On voit ce qu'on veut bien nous montrer. »","« Parfois, je regarde quelqu'un rentrer chez lui, tous les soirs, pendant des mois. Je finis par le connaître. Lui, il ne sait même pas que j'existe. »","« L'amélioration d'image, ce n'est pas de la magie. C'est de la patience, des algorithmes et un peu de chance. »"])));
    c.npcs=[mkn(300,147,'chair',-1,2,.2)];c.sOcc=[[100,108,470,132]];
  }else if(f===9){
    A(40,"Prendre l'ascenseur",()=>polMenu());
    A(100,'Parler au procureur',()=>U(polLine('pr',["Le procureur ajuste ses manchettes : « Un bon dossier, c'est des preuves scellées et un témoin qui ne tremble pas. Le reste, c'est de la littérature. »","« Je plaide ce que vous m'apportez, inspecteur. Apportez-moi mieux. »"])));
    A(190,'Témoigner à la barre',()=>hearPanel());
    A(300,'Observer la salle',()=>U("La salle d'audience : boiseries sombres, bancs usés, une balance dorée au mur. Des générations de mensonges et de vérités se sont frottées ici. Le silence a un poids."));
    A(440,"Parler à l'avocat de la défense",()=>U(polLine('av',["L'avocat de la défense te sourit sans chaleur : « Tout peut se défendre, inspecteur. Surtout un dossier mal ficelé. »","« Je ne vous en veux pas. C'est mon métier de douter de vous. »"])));
    c.npcs=[mkn(280,132,'stand',-1,5,.2,{c:{jk:'#14141c',sl:'#1c1c26',pt:'#0a0a10',h:'#d8d8d8'},big:1}),mkn(100,150,'stand',1,2,.5),mkn(440,150,'stand',-1,3,.9)];c.sOcc=[[220,92,340,132]];
  }else if(f===10){
    c.am='rgb(70,76,98)';c.sOcc=[[166,104,258,132]];
    const R1=S.intIn?resByKey(S.intIn):null,ok=!!(R1&&!R1.dead&&!R1.pris&&(R1.cust||(S.summ||[]).some(q=>q.key===R1.key&&q.st==='here'&&q.where==='inter')));if(!ok)S.intIn=null;
    A(30,'Sortir de la salle',()=>{intEnd();goPol(3,340)});
    A(84,"Interphone : faire entrer quelqu'un",()=>interPanel());
    A(148,"T'asseoir face au suspect",()=>sitInter());
    A(190,'Examiner la table',()=>tk('itab',["Une table en acier, vissée au sol. Un anneau soudé au milieu, pour les menottes. Des centaines de rayures : des initiales, des dates, un mot qui revient, gratté à l'ongle : « INNOCENT ».","Sous le plateau, du chewing-gum séché. Et plus loin, un petit mot au crayon : « Ils écoutent derrière la vitre. »","L'enregistreur est posé, voyant rouge allumé. Tu appuies sur lecture : un souffle, un raclement de chaise, et une voix qui répète « je veux un avocat »."]));
    A(236,'Observer la vitre sans tain',()=>tk('imir',["La vitre sans tain renvoie ton reflet : un type fatigué, un chapeau, des cernes. Derrière, dans le noir, tu devines une silhouette qui t'observe et ne bouge pas.","Tu poses la main sur le verre froid. De l'autre côté, un léger bruit : quelqu'un a reculé sa chaise. Le capitaine, peut-être."]));
    if(ok){A(268,'Interroger '+R1.fn,()=>{if(!S.seated)sitInter();interDlg(R1,R1.fn+" lève les yeux vers toi. La lampe crue lui dessine des ombres sous les yeux.")});

function shoot(){
  if(!S.gun){say("Le moniteur t'arrête d'un geste : « Où est ton arme, inspecteur ? Passe à l'armurerie. »");return}
  if(S.ammo<=0){say("Chargeur vide. L'armurerie est à côté : tu y retires des munitions.");return}
  const R=S.rng;S.ammo--;R.t=performance.now()/1000;sfx('shot');
  const sp=5+S.drunk*16+(R.mov?4:0)-(S.boostT>0?1:0),gs=()=>(Math.random()+Math.random()+Math.random()-1.5)*1.4,hx=gs()*sp,hy=gs()*sp,r=Math.hypot(hx,hy),pts=Math.max(0,10-Math.floor(r/2.2));
  R.holes.push({x:hx,y:hy,mx:R.mov?Math.sin(performance.now()/700)*28:0});R.score+=pts;R.shots++;
  if(R.score>R.best&&R.shots>=6)R.best=R.score;
  const txt2=pts>=9?"Dans le mille !":pts>=6?"Bien groupé.":pts>0?"Un peu large...":"Raté. Le papier ne bronche pas.";
  say(txt2+" (+"+pts+") Total : "+R.score+" sur "+R.shots+" tir"+(R.shots>1?"s":"")+(R.shots===6?". Série terminée : "+R.score+"/60.":"")+" Munitions : "+S.ammo+".");
}

const zrow=(a,l,b)=>'<div class="row"><span>'+l+'</span><button data-zp="'+a+'">'+(b||'Choisir')+'</button></div>';

const BMS={dock:[['mkey','Clé de maintenance',90,"Une clé plate, usée. Elle ouvre les grilles du Dessous."],['ammo','Chargeur de munitions',25,"Un chargeur plein, sans numéro de série."],['fake','Faux pass de la Cité',320,"Un laissez-passer imprimé en soute : il trompe un drone, pas un humain."],['bandage','Pansements',6,"Un rouleau, un peu jaune."],['piles','Piles',8,"Quatre piles. Au moins elles sont chargées."],['pills','Pilules énergisantes',15,"Bleues. Ne demande pas ce qu'il y a dedans."]],under:[['ammo','Chargeur de munitions',22,"Fraîchement volé à l'armurerie d'un entrepôt."],['bandage','Pansements',5,"Un stock de clinique, pas très honnête."],['pills','Pilules énergisantes',12,"La spécialité de la maison."],['piles','Piles',7,"Un lot de récupération."],['rope','Corde',9,"Un mètre de câble tressé."]]};
function bmPanel(z){let h='<h3>'+(z==='dock'?'Marché noir des docks':'Marché clandestin')+'</h3><p><small>Le vendeur te toise : « Pas de questions, pas de reçu. »'+(isCop()?' Avec ton insigne, la tension monte.':'')+'</small></p>';
  for(const it of BMS[z])h+=zrow('bm:'+z+'|'+it[0],it[1]+'<br><small>'+it[3]+'</small>',it[2]+' cr');
  h+=zrow('bm:'+z+'|info','Une rumeur sur l\'affaire en cours<br><small>« J\'ai entendu des choses... »</small>','25 cr');
  if(isCop())h+=zrow('bm:'+z+'|raid','Faire une descente (saisir le stock)<br><small>réputation +, risque de bagarre</small>','Descente');
  panel(h+PCL)}
function bmBuy(v){const [z,id]=v.split('|');
  if(id==='raid'){if(!isCop()){say("Sans insigne, une descente serait du braquage.");return}
    if(Math.random()<.4){const d=12+((Math.random()*18)|0);S.hp=Math.max(0,S.hp-d);S.hitT=.9;sfx('thud');say("Tu cries « Police ! » : le vendeur renverse l'étal et te frappe au passage. Tu t'écrases contre une caisse... puis tu le plaques. -"+d+" santé, mais tu confisques la moitié du stock.");if(S.hp<=0){blackout();return}}else say("Tu fais irruption, badge levé : « Police ! Plus un geste ! » Le vendeur lève les mains. Tu confisques un sac de pilules et des pièces volées.");
    const g=40+((Math.random()*60)|0);S.cash+=g;S.rep=Math.min(100,S.rep+3);sfx('cash');setTimeout(()=>say("La saisie te rapporte "+g+" cr au dossier. Réputation "+S.rep+". Le marché fermera quelques jours."),1800);return}
  if(id==='info'){if(S.cash<25){say("Il te manque quelques crédits.");return}const cs=activeCase();if(!cs){say("Le vendeur se penche : « Tu veux une rumeur ? Il faut d'abord une affaire. » Il ne vend pas du vent.");return}S.cash-=25;sfx('cash');const A=attrOf(resByKey(cs.perp)),have=profileOf(cs),ks=['shift','color','hobby','dist','smoker'].filter(k=>have[k]===undefined);if(!ks.length){say("Il hausse les épaules : « Tu sais déjà tout ce que je sais. »");S.cash+=25;return}const k=ks[(hashS(cs.id+S.gm)>>3)%ks.length],txt={shift:"celui que tu cherches vit la nuit",color:"on l'a vu avec un manteau "+CN[A.color],hobby:"il passe son temps à "+resByKey(cs.perp).hobby,dist:"il traîne du côté de "+D[A.dist].n,smoker:A.smoker?"il fume":"il ne fume pas"}[k];const e={id:'bm'+Math.floor(S.gm)+k,txt:"Rumeur du marché noir : "+txt+".",where:'marché noir',hid:0,rev:[k,A[k]],pts:null};cs.ev.push(e);S.ev[evK(cs,e)]=1;say("Le vendeur glisse, sans te regarder : « "+txt+". Tu ne l'as pas entendu de moi. » (indice ajouté à l'affaire "+cs.id+")");return}
  const it=BMS[z].find(q=>q[0]===id);if(!it)return;if(S.cash<it[2]){say("Il te manque quelques crédits. Le vendeur croise les bras : « Pas de crédit. »");return}S.cash-=it[2];sfx('cash');
  if(id==='ammo'){S.ammo+=12;say("Tu glisses un chargeur dans ta poche. "+S.ammo+" balles au total.")}else{addItem(id,id==='piles'?4:1);say("Tu achètes : "+it[1]+". "+it[3])}}
// ---- DOCKS : actions
function dockLoot(x){const day=Math.floor(S.gm/1440);S.dkS=S.dkS||{};if(S.dkS[x]===day){U("Tu as déjà fouillé ce coin aujourd'hui : des cartons vides, des rats déjà passés avant toi.");return}S.dkS[x]=day;S.gm+=8;const r=mkr(hashS('dk'+x+'|'+day)),p=r();
  if(p<.26){const g=8+((r()*30)|0);S.cash+=g;sfx('cash');U("Sous un carton moisi, une enveloppe de paie de docker oubliée : "+g+" crédits. Le propriétaire doit pleurer quelque part.")}
  else if(p<.42){addItem('piles',2);U("Une caisse de matériel de manutention : des lampes cassées, mais deux piles encore bonnes. Tu les empoches.")}
  else if(p<.56&&isCop()){S.rep=Math.min(100,S.rep+2);U("Sous un faux fond, des cartouches de pilules bleues, emballées pour l'export. Tu les saisis. Réputation +2. Quelqu'un va être très en colère.")}
  else if(p<.7){addItem('bandage',1);U("Une trousse de secours dans une vieille caisse, presque intacte. Il reste un rouleau de pansements.")}
  else if(p<.85)U("Que des pièces détachées d'électroménager, des câbles gainés de goudron, un soulier dépareillé. L'odeur de mazout te pique les yeux.");
  else{S.hp=Math.max(1,S.hp-6);S.hitT=.5;sfx('thud');U("Tu plonges la main dans la caisse : un rat énorme te mord le pouce avant de filer. -6 santé. Il y avait peut-être quelque chose sous lui... mais plus maintenant.")}}
function dockWatch(){panel('<h3>Cabine de la grue</h3><p><small>Tu grimpes dans la cabine : une vitre sale, des leviers, et une vue plongeante sur les quais. Observer prend du temps.</small></p>'+zrow('dw:1','Observer les quais 1 heure','Observer')+zrow('dw:3','Observer les quais 3 heures','Observer')+PCL)}
function dockWatchGo(h){S.gm+=h*60;const cs=activeCase(),L=["À l'aube, deux camions sans plaque chargent des caisses sans manifeste.","Un docker vend discrètement quelque chose dans un sac à un homme en imperméable.","Un conteneur bleu est déplacé deux fois, comme si quelqu'un ne voulait pas qu'il soit retrouvé.","Une voiture noire aux vitres teintées attend, moteur tournant, au bout du quai 4.","Un cargo décharge de grandes caisses étiquetées « PIÈCES MÉDICALES ». Trop lourdes pour des pièces médicales."];
  let txt=L[(hashS('dw'+Math.floor(S.gm))%L.length)];
  if(cs&&Math.random()<.5){const A=attrOf(resByKey(cs.perp)),have=profileOf(cs);if(have.dist===undefined){const e={id:'dw'+Math.floor(S.gm),txt:"Quais : un homme correspondant au profil passe par "+D[A.dist].n+" avant de rejoindre les quais.",where:'surveillance',hid:0,rev:['dist',A.dist],pts:null};cs.ev.push(e);S.ev[evK(cs,e)]=1;txt+=" Et puis, au loin, quelqu'un qui pourrait correspondre à ton affaire "+cs.id+" passe du côté de "+D[A.dist].n+"."}}
  sfx('cloth');say("Tu t'installes dans la cabine pendant "+h+" h. "+txt)}
function dockJob(){const day=Math.floor(S.gm/1440);if(S.dkJ===day){say("Le contremaître fait non du menton : « Plus besoin de bras aujourd'hui. »");return}S.dkJ=day;S.gm+=60;const g=35+((Math.random()*25)|0);S.cash+=g;S.hp=Math.max(1,S.hp-4);sfx('cash');say("Tu passes une heure à décharger des caisses sous la pluie, le dos en vrille, la main à vif. Le contremaître compte les crédits : "+g+" cr, et il te tape sur l'épaule. -4 santé.")}
function dockSalvage(){S.gm+=10;const p=Math.random();
  if(p<.34){addItem('part',1);sfx('lock');say("Tu fouilles un tas de câbles et de plaques de blindage : une pièce encore chaude au toucher. Un connecteur gravé d'un sigle étrange, « N6 ». Tu la glisses dans ton sac (Pièces de répliquant ×"+S.inv.part+").")}
  else if(p<.5){addItem('tape',1);say("Sous une portière de voiture, un rouleau de ruban adhésif noir à moitié utilisé. Ça peut toujours servir.")}
  else if(p<.62&&!S.eye){S.eye=1;say("Entre deux plaques de blindage, quelque chose brille : un œil artificiel, la pupille encore ouverte, avec le sigle « NEXUS-6 » gravé sur le pourtour. Il n'était pas là par hasard. Tu pourrais le montrer à Gus, le ferrailleur.")}
  else if(p<.72){S.hp=Math.max(1,S.hp-8);S.hitT=.6;sfx('thud');say("Une tôle coupante te lacère l'avant-bras : sang, jurons, et une odeur de métal dans la bouche. -8 santé. Les pansements seraient une bonne idée.")}
  else say("Que du métal tordu, des écrans fendus qui diffusent une neige grise, un bras mécanique qui pend d'un tas comme pour te saluer. Rien à garder.")}
function dockGus(){const L=["Gus essuie ses mains sur son tablier : « Les gens jettent leurs pièces, moi je les fais renaître. Les pièces de répliquants, c'est de l'or : tout le monde en veut, personne n'en parle. »","« Un jour, un gars en costume m'a offert mille crédits pour un œil de Nexus-6. J'ai dit non. Les yeux, ça regarde. »","« Les répliquants ne meurent pas, tu sais. Ils se démontent. Ça se vend au kilo. »"];
  panel('<h3>Gus, ferrailleur</h3><p>'+polLine('gus',L)+'</p>'+(S.inv.part>0?zrow('bm:dock|gsell','Lui vendre des pièces ('+S.inv.part+')<br><small>18 cr pièce</small>','Vendre'):'')+(S.eye?zrow('bm:dock|geye','Lui montrer l\'œil Nexus-6<br><small>Il en sait plus qu\'il ne dit</small>','Montrer'):'')+PCL)}
const _bmBuy=bmBuy;bmBuy=function(v){const [z,id]=v.split('|');
  if(id==='gsell'){const n=S.inv.part||0;if(!n){say("Tu n'as rien à lui vendre.");return}S.inv.part=0;S.cash+=18*n;sfx('cash');say("Gus compte, pèse, marmonne : « "+n+" pièce"+(n>1?'s':'')+", ça fait "+(18*n)+". » Il glisse tout dans un sac sans le moindre remords. +"+(18*n)+" cr.");return}
  if(id==='geye'){S.eyeSeen=1;say("Gus devient très pâle. « Où tu as trouvé ça ?! » Il baisse la voix : « Ce n'est pas une pièce d'usine. Il y a un numéro dessous : N6-MPA-03. Lucky parlait de ce numéro dans le secteur 9. Si j'étais toi, je chercherais du côté de la clinique du Dessous. » Un lien de plus dans ton enquête.");const cs=activeCase();if(cs){const e={id:'eye',txt:"Gus (ferrailleur) a identifié un œil de Nexus-6 numéroté N6-MPA-03 : piste vers la clinique du Dessous.",where:'indic',hid:0,rev:null,pts:null};if(!cs.ev.some(q=>q.id==='eye')){cs.ev.push(e);S.ev[evK(cs,e)]=1}}return}
  return _bmBuy(v)};
function dockBarrel(){S.warmT=Math.max(S.warmT||0,25);sfx('cloth');say("Tu tends les mains au-dessus du baril en feu. La chaleur te monte aux bras, la pluie crépite dans les braises. Un docker te tend un gobelet de thé noir sans un mot.")}

  c.npcs.push(mk(120,150,'stand',1,3,.4,{c:{jk:'#3a4a5a',sl:'#4a5a6a',pt:'#1c2430',h:'#15110f'}}));zA(c,104,'Parler au vigile du portail',()=>tk('dkv',["« Les docks sont fermés aux curieux. Tu as un badge ? Tu es un flic ? Alors circule, et garde les mains dans les poches. »","« On a de nouvelles consignes : tout ce qui sort passe par moi. Enfin, presque tout. »","« La nuit, il y a des bruits sous les quais. Je ferme les yeux, les yeux ne payent pas. »"]));

function ferryGo(v){if(S.cash<10){say("Il te manque quelques crédits pour le ticket.");return}S.cash-=10;S.gm+=60;sfx('cardoor');fade=1;
  const ev=[()=>{const g=15+((Math.random()*30)|0);S.cash+=g;sfx('cash');return "En pleine baie, un passager somnole la main ouverte : un porte-monnaie dépasse de sa poche. Tu ne voles pas, tu le lui rends : il te donne "+g+" cr de récompense."},()=>{const cs=activeCase();if(cs&&!cs.ev.some(e=>e.id==='ferry')){const A=attrOf(resByKey(cs.perp));const e={id:'ferry',txt:"Un passager du ferry a vu un homme au manteau "+CN[A.color]+" monter à l'aube.",where:'ferry',hid:0,rev:['color',A.color],pts:null};cs.ev.push(e);S.ev[evK(cs,e)]=1;return "Le barman du bord glisse : « Un type au manteau "+CN[A.color]+" est monté ce matin, il tremblait comme une feuille. » (indice ajouté)"}return "Tu discutes avec un vieux marin qui regrette l'ancienne mer, celle qui n'était pas verte."},()=>"À la proue, tu aperçois une silhouette très droite, immobile, qui fixe l'horizon : un répliquant, peut-être. Il te regarde, hoche la tête, et disparaît dans la cabine.",()=>{S.cash=Math.max(0,S.cash-10);return "Un gamin te bouscule dans la coursive. Quand tu te retournes, il a disparu avec dix crédits."},()=>"La baie défile : la mer verte fume, des cargos rouillent à l'ancre, la pluie fouette le pont. Pendant une heure, personne ne te demande rien."];
  say("Le ferry « Pélican » appareille dans un grincement de chaînes. Tu t'accoudes au bastingage. "+ev[(Math.random()*ev.length)|0]())}
function ferryPanel(){panel('<h3>Ferry « Le Pélican »</h3><p><small>Traversée de nuit de la baie : une heure, un ticket à 10 crédits. On ne sait jamais qui monte à bord.</small></p>'+zrow('fy:go','Traversée de nuit','10 cr')+PCL)}
function fortuneMenu(){panel('<h3>Madame Xu, voyante</h3><p>'+polLine('xu',["Elle bat des cartes sans te regarder : « Ce que tu cherches te cherche aussi, inspecteur. »","« Les cartes ne mentent jamais. Les gens, tout le temps. »","« Il y a une fenêtre éclairée, un homme debout, la pluie qui ne s'arrête pas... Tu connais. »"])+'</p>'+zrow('fs:cards','Tirer les cartes (25 cr)<br><small>un indice, parfois utile</small>','25 cr')+PCL)}
function fortuneDo(v){if(S.cash<25){say("Il te manque quelques crédits.");return}S.cash-=25;sfx('cash');S.gm+=10;const cs=activeCase();
  if(cs&&Math.random()<.6){const P=resByKey(cs.perp),A=attrOf(P),have=profileOf(cs),ks=['shift','color','hobby','dist','smoker'].filter(k=>have[k]===undefined);if(ks.length){const k=ks[(hashS(cs.id+'x'+Math.floor(S.gm))>>2)%ks.length],tx={shift:"Je vois quelqu'un qui n'existe qu'à la nuit tombée",color:"Je vois un manteau "+CN[A.color],hobby:"Je vois quelqu'un qui aime "+P.hobby,dist:"Je vois le chemin de "+D[A.dist].n,smoker:A.smoker?"Je sens la fumée de cigarette":"Je ne sens aucune fumée"}[k];const e={id:'xu'+Math.floor(S.gm),txt:"Madame Xu : « "+tx+". »",where:'voyante',hid:0,rev:[k,A[k]],pts:null};cs.ev.push(e);S.ev[evK(cs,e)]=1;say("Elle retourne trois cartes. Son visage change. « "+tx+". » Elle n'en dit pas plus. (indice ajouté à l'affaire "+cs.id+")");return}}

function arcadePanel(){panel('<h3>Salle d\'arcade « Néon »</h3><p><small>Une machine de pari clignote : « Double ou rien ». Tu mises, la roue tourne.</small></p>'+zrow('ar:5','Miser 5 cr','5 cr')+zrow('ar:20','Miser 20 cr','20 cr')+PCL)}
function arcadeGo(m){if(S.cash<m){say("Il te manque quelques crédits.");return}S.cash-=m;sfx('slotlose');S.gm+=5;if(Math.random()<.42){S.cash+=m*2;sfx('cash');say("La roue claque, s'arrête sur le jackpot. La machine crache "+(m*2)+" crédits dans un cliquetis de pièces. Le gamin à côté siffle.")}else say("La roue ralentit, hésite, tombe sur le noir. Les lumières rient sans toi. Tu as perdu "+m+" cr.")}
function fishAct(){S.gm+=20;const p=Math.random();
  if(p<.3){addItem('fish',1);say("Tu lances la ligne dans l'eau verte. Une secousse : un poisson à trois yeux, translucide, tu peux presque voir son coeur battre. Tu le mets dans ton sac. (Poisson mutant, revendable 14 cr)")}
  else if(p<.45){const cs=activeCase();if(cs&&!cs.ev.some(e=>e.id==='bottle')){const e={id:'bottle',txt:"Une bouteille repêchée contient un mot : « Je ne peux plus continuer à me taire. » signé d'une initiale.",where:'pêche',hid:0,rev:null,pts:null};cs.ev.push(e);S.ev[evK(cs,e)]=1;say("Quelque chose accroche : une bouteille de verre épais, un papier roulé dedans. « Je ne peux plus continuer à me taire. » Une initiale tremblée. Ça pourrait n'être rien. Ça pourrait être beaucoup. (indice ajouté)");return}say("Tu repêches une vieille bouteille. Dedans, un papier moisi : illisible. L'eau acide a tout mangé.")}
  else if(p<.6)say("Tu repêches une botte pleine d'eau verte. Une botte, rien qu'une botte, et l'odeur qui l'accompagne.");
  else say("Vingt minutes de silence, de pluie sur la jetée, de ligne qui oscille. Rien ne mord. C'est peut-être ça, pêcher.")}
function lightHouse(){S.gm+=15;const cs=activeCase();say("Tu montes les marches en colimaçon, essoufflé. En haut, la lampe tourne sans bruit, énorme. Le gardien te laisse regarder : la baie, le port, les lumières de la ville tout au fond, et très haut, un point qui brille au-dessus des nuages. « La Cité suspendue, »"+" souffle-t-il. « On dit que là-haut la pluie n'existe pas. »"+(S.mis?" Au loin, un spinner clignote sur un toit : la plateforme de ta mission.":""))}

// ===== LE DESSOUS, CITÉ SUSPENDUE, TOITS, HÔPITAL, MISSIONS
const GANG={rats:{n:'les Rats',x:540,col:'#ff2a96'},spec:{n:'les Spectres',x:2790,col:'#25f4ff'}};
function gangPanel(g){const G=GANG[g];panel('<h3>Territoire des '+G.n.replace('les ','')+'</h3><p>Trois silhouettes en capuche te barrent la route. Le plus grand croise les bras : « Tu veux passer ? Tout le monde paye. Surtout les gens comme toi. » '+(isCop()?'Il fixe ton imperméable avec un sourire sans dents.':'')+'</p>'+zrow('gt:'+g+'|pay','Payer le péage<br><small>20 cr</small>','20 cr')+zrow('gt:'+g+'|bluff','Les intimider<br><small>'+(isCop()?'insigne et regard noir':'tenter ta chance')+'</small>','Bluffer')+(hasGun()?zrow('gt:'+g+'|gun','Dégainer<br><small>réputation -2, ils reculent</small>','Dégainer'):'')+zrow('gt:'+g+'|back','Faire demi-tour','Partir')+PCL)}
function gangDo(v){const [g,k]=v.split('|'),G=GANG[g],day=Math.floor(S.gm/1440);S.toll=S.toll||{};
  if(k==='pay'){if(S.cash<20){say("Il te manque quelques crédits. Le grand rigole : « Reviens quand tu seras riche. »");return}S.cash-=20;S.toll[g]=day;sfx('cash');say("Tu glisses les crédits dans une main sale. Le grand s'écarte d'un demi-pas : « Passe. Et ne regarde pas trop. »");return}
  if(k==='bluff'){const p=isCop()?.5:.3;if(Math.random()<p){S.toll[g]=day;if(isCop())S.rep=Math.min(100,S.rep+1);say("Tu avances d'un pas, le regard dur, la main près du holster. Le grand soutient ton regard, puis détourne les yeux. « C'est bon, flic. Pour cette fois. »")}else{const d=10+((Math.random()*12)|0);S.hp=Math.max(0,S.hp-d);S.hitT=.9;sfx('thud');S.toll[g]=undefined;say("Ton bluff ne prend pas : un poing te cueille sous l'œil, un autre dans les côtes. Tu t'écroules contre un mur de brique. -"+d+" santé. « La prochaine fois, tu paieras. »");if(S.hp<=0)blackout()}return}
  if(k==='gun'){if(!hasGun()){say("Tu n'as pas ton arme.");return}S.toll[g]=day;S.rep=Math.max(0,S.rep-2);sfx('shot');say("Tu sors ton blaster en un éclair. Les trois silhouettes reculent, mains levées. « Wow, calme, flic. » Tu passes, le cœur battant. Réputation "+S.rep+" : on te regardera autrement dans le Dessous.");return}
  say("Tu fais demi-tour. Derrière toi, un rire gras résonne dans les tuyaux.")}
function vexPanel(){panel('<h3>Dr Vex — clinique clandestine</h3><p>'+polLine('vex',["Une silhouette maigre, des lunettes à loupe, un tablier tâché : « Je ne pose pas de questions, je soigne. Les gens d'en haut ne peuvent pas payer, ceux d'en bas ne peuvent pas attendre. »","« Les yeux, c'est ma spécialité. Tu en voudrais un meilleur ? »","« N6, tu dis ? J'ai déjà vu ces numéros... mais je n'ai rien vu du tout. »"])+'</p>'+zrow('vx:heal','Se faire soigner (santé 100)<br><small>pas de questions</small>','30 cr')+(S.implant?'':zrow('vx:impl','Implant oculaire de visée<br><small>réduit la dispersion de tes tirs</small>','150 cr'))+zrow('vx:ask','Poser des questions sur les Nexus-6','Demander')+PCL)}
function vexDo(v){

function underBar(){panel('<h3>Le Trou — bar clandestin</h3><p>Un comptoir en planches, une ampoule rouge, des gens qui parlent trop bas. Le barman ne te regarde jamais dans les yeux.</p>'+zrow('bb:drink','Un verre de gnôle<br><small>réchauffe, trouble la vue</small>','10 cr')+zrow('bb:rumor','Écouter les conversations<br><small>un indice peut-être</small>','Écouter')+zrow('bb:fight','Parier sur le combat clandestin<br><small>20 cr : gain double, ou presque</small>','20 cr')+PCL)}
function barDrink(v){

    say("Tu écoutes un quart d'heure : disputes de dettes, rumeurs de contrebande, un homme qui jure avoir vu un mort marcher. Rien d'utile pour ton enquête.");return}

function underBlockTick(){const c=CI;if(!c||c.z!=='under')return;const day=Math.floor(S.gm/1440),t=performance.now();for(const g in GANG){const G=GANG[g];if(rx>G.x&&(S.toll||{})[g]!==day){rx=G.x-2;rv=0;if(t-(c.lb||0)>2800){c.lb=t;gangPanel(g)}}}}
